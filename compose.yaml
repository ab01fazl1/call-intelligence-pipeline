name: callintel

x-app: &app
  image: callintel:latest
  build:
    context: .
    args:
      REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      APT_MIRROR: ${APT_MIRROR:-}
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://callintel:callintel@postgres:5432/callintel
    AMQP_URL: amqp://callintel:callintel@rabbitmq:5672/
    S3_ENDPOINT: http://objectstore:7070
    S3_ACCESS_KEY: callintel
    S3_SECRET_KEY: callintel-secret
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ANALYZER_VERSION: ${ANALYZER_VERSION:-v3}
  depends_on: &app-deps
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    objectstore: { condition: service_started }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: ${REGISTRY_PREFIX:-}postgres:16-alpine
    environment:
      POSTGRES_USER: callintel
      POSTGRES_PASSWORD: callintel
      POSTGRES_DB: callintel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callintel -d callintel"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: ${REGISTRY_PREFIX:-}rabbitmq:4.3-management
    hostname: rabbitmq  # quorum queue data is tied to the node name
    environment:
      RABBITMQ_DEFAULT_USER: callintel
      RABBITMQ_DEFAULT_PASS: callintel
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-callintel.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  # S3-compatible object storage (VersityGW over a POSIX volume). Any S3 works: point
  # S3_ENDPOINT at MinIO, Ceph RGW or AWS instead.
  objectstore:
    image: ${REGISTRY_PREFIX:-}versity/versitygw:latest
    command: ["--access", "callintel", "--secret", "callintel-secret", "--port", ":7070",
              "posix", "/data"]
    ports: ["7070:7070"]
    volumes: [objects:/data]

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    <<: *app
    ports: ["8000:8000"]
    command: ["uvicorn", "callintel.gateway.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  outbox-relay:
    <<: *app
    command: ["python", "-m", "callintel.relay"]

  worker-preprocess:
    <<: *app
    command: ["python", "-m", "callintel.workers", "preprocess"]

  worker-asr:
    <<: *app
    command: ["python", "-m", "callintel.workers", "asr"]
    stop_grace_period: 90s  # let an in-flight transcription finish on `docker compose stop`
    environment:
      <<: *app-env
      SHUTDOWN_GRACE_S: "85"  # < stop_grace_period, so we cancel before Docker SIGKILLs
      ASR_BACKEND: mock
      MOCK_ASR_RTF: ${MOCK_ASR_RTF:-0.1}
      MOCK_ASR_WER: ${MOCK_ASR_WER:-0.0}
      MOCK_ASR_FAILURE_RATE: ${MOCK_ASR_FAILURE_RATE:-0.0}
      GROUND_TRUTH_DIR: /app/data
    volumes: ["./data:/app/data:ro"]

  worker-analysis:
    <<: *app
    command: ["python", "-m", "callintel.workers", "analysis"]

  worker-deadletter:
    <<: *app
    command: ["python", "-m", "callintel.workers", "deadletter"]

  prometheus:
    profiles: [obs]
    image: ${REGISTRY_PREFIX:-}prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    profiles: [obs]
    image: ${REGISTRY_PREFIX:-}grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  rabbitmq:
  objects:
