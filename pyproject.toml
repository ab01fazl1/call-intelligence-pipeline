[project]
name = "callintel"
version = "0.1.0"
description = "Asynchronous call-intelligence pipeline: streaming ingestion, Persian ASR and QA/compliance scoring over RabbitMQ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aio-pika>=9.4",
    "aiobotocore>=2.13",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Synthetic data generation (Microsoft Edge neural TTS; only needed on the host).
synth = ["edge-tts>=6.1.12"]
# Real ASR backend. Pulls CTranslate2 + PyAV; model weights are downloaded on first use.
whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: needs the docker compose stack running (make up)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# Offline CLIs and operator scripts, not server code.
per-file-ignores = { "src/callintel/synth/*" = ["ASYNC240"], "scripts/*" = ["ASYNC240", "ASYNC109", "ASYNC110", "E501"], "infra/*" = ["E501"] }
ignore = ["RUF001", "RUF002", "RUF003"]  # Persian text contains "ambiguous" unicode by design
